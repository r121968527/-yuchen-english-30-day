<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>雨辰英语30天挑战</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.6}
header{background:#111827;color:white;padding:25px 16px;position:sticky;top:0;z-index:5}.head{max-width:820px;margin:auto;display:flex;justify-content:space-between;align-items:center}
h1{font-size:24px;margin:0}.sub{font-size:13px;opacity:.75}main{max-width:820px;margin:auto;padding:14px 14px 70px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0000000d}
h2{font-size:20px;margin:0 0 12px}h3{font-size:17px;margin:20px 0 8px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.db{padding:9px 2px;border:1px solid #d6dbe3;background:#fff;border-radius:9px;font-size:13px}.db.active{background:#111827;color:#fff}.db.done{border-color:#16803c}
.progress{height:8px;background:#e5e8ed;border-radius:99px;overflow:hidden}.bar{height:100%;background:#111827;width:0}.word{display:inline-block;background:#eef1f4;padding:5px 8px;margin:3px;border-radius:8px;font-size:14px}
.q{border:1px solid #dfe3e9;border-radius:11px;padding:12px;margin:9px 0}.qtext{font-weight:700;margin-bottom:8px}.choice{display:block;padding:10px;margin:6px 0;border:1px solid #d7dce4;border-radius:9px;cursor:pointer}.choice input{margin-right:8px;transform:scale(1.15)}
.choice.correct{background:#eefaf2;border-color:#16803c}.choice.wrong{background:#fff0f1;border-color:#b42318}.reading{background:#f7f8fa;padding:13px;border-radius:10px}
textarea{width:100%;min-height:130px;border:1px solid #cbd1da;border-radius:10px;padding:10px;font:inherit}.short{min-height:80px}button{border:0;border-radius:10px;padding:11px 14px;background:#111827;color:#fff;margin:4px;font-size:15px}.secondary{background:#e9edf2;color:#172033}
.result{padding:12px;border-radius:10px;margin-top:10px}.good{background:#eefaf2;color:#166534}.bad{background:#fff0f1;color:#991b1b}.small{font-size:13px;color:#687386}
</style></head>
<body>
<header><div class="head"><div><h1>雨辰英语 30 天挑战</h1><div class="sub">Grade 6 · ELA 强化训练 · Safari 网页版</div></div><b id="badge">Day 1</b></div></header>
<main>
<section class="card"><h2>学习进度</h2><div id="pt">完成 0 / 30 天</div><div class="progress"><div id="bar" class="bar"></div></div></section>
<section class="card"><h2>选择训练日</h2><div id="nav" class="grid"></div><p class="small">点击 Day 1–30。答案会自动保存到当前浏览器。</p></section>
<section class="card" id="lesson"></section>
<section class="card" id="writing"></section>
<section class="card"><h2>提交与批改</h2><button onclick="grade()">提交并自动批改语法</button><button class="secondary" onclick="save()">保存</button><button class="secondary" onclick="clearDay()">清空今天</button><div id="result"></div></section>
<section class="card"><h2>AI 老师</h2><p class="small">点击复制后，把内容粘贴到 ChatGPT，可继续批改阅读、纠错、写作和口语。</p><button onclick="copyAI()">复制 AI 批改内容</button></section>
</main>
<script>
const DATA=__DATA__;
let current=Number(localStorage.getItem("yc_day")||1);
function storageKey(){return "yc_"+current}
function load(){try{return JSON.parse(localStorage.getItem(storageKey())||"{}")}catch(e){return {}}}
function save(){
 const d={answers:[]};
 document.querySelectorAll('input[type="radio"]').forEach(x=>{if(x.checked)d.answers[Number(x.dataset.q)]=Number(x.value)});
 d.correction=document.getElementById("correction").value;
 d.reading=[0,1,2,3,4].map(i=>document.getElementById("r"+i).value);
 d.writing=document.getElementById("writingText").value;d.speaking=document.getElementById("speaking").value;
 localStorage.setItem(storageKey(),JSON.stringify(d));updateProgress();
}
function done(i){return localStorage.getItem("yc_done_"+i)==="1"}
function renderNav(){
 const n=document.getElementById("nav");n.innerHTML="";
 for(let i=1;i<=30;i++){let b=document.createElement("button");b.className="db"+(i===current?" active":"")+(done(i)?" done":"");b.textContent="Day "+i;b.onclick=()=>{save();current=i;localStorage.setItem("yc_day",i);render()};n.appendChild(b)}
}
function render(){
 const d=DATA[current-1],s=load();document.getElementById("badge").textContent="Day "+current;renderNav();
 let g=d.questions.map((q,i)=>'<div class="q"><div class="qtext">'+(i+1)+'. '+q.q+'</div>'+q.opts.map((o,j)=>'<label class="choice"><input type="radio" name="q'+i+'" data-q="'+i+'" value="'+j+'" '+(s.answers&&s.answers[i]===j?"checked":"")+'>'+String.fromCharCode(65+j)+'. '+o+'</label>').join("")+'</div>').join("");
 document.getElementById("lesson").innerHTML='<h2>Day '+d.day+' · '+d.title+'</h2><p><b>重点：</b>'+d.focus+'</p><h3>① Vocabulary · 10 个词</h3><div>'+d.words.map(w=>'<span class="word">'+w+'</span>').join("")+'</div><h3>② Grammar · 5 题</h3>'+g+
 '<h3>③ Sentence Correction · 3 题</h3><ol><li>She study English every day. ______</li><li>Yesterday I go to the library. ______</li><li>They is ready for class. ______</li></ol><textarea id="correction" placeholder="写出三个正确句子">'+(s.correction||"")+'</textarea>'+ 
 '<h3>④ Reading · 5 题</h3><div class="reading"><b>'+d.reading_title+'</b><br>'+d.reading+'</div>'+ 
 ['What is the passage mainly about?','What problem or goal does the student/group have?','What action did they take?','What changed afterward?','What evidence supports the main idea?'].map((q,i)=>'<div class="q"><div class="qtext">'+(i+1)+'. '+q+'</div><textarea id="r'+i+'" placeholder="Write your answer...">'+((s.reading&&s.reading[i])||"")+'</textarea></div>').join("");
 document.getElementById("writing").innerHTML='<h2>⑤ Writing · 10–15 分钟</h2><p><b>Describe a habit that can help a student improve.</b> 写 6–8 句英文。</p><textarea id="writingText" placeholder="Write your paragraph here...">'+(s.writing||"")+'</textarea><h3>⑥ Speaking · 3 分钟</h3><p><b>What is one thing you want to improve at school, and why?</b></p><textarea id="speaking" class="short" placeholder="先写关键词，再大声说出来。">'+(s.speaking||"")+'</textarea>';
 document.getElementById("result").innerHTML="";
 updateProgress();
}
function grade(){
 save();const d=DATA[current-1],s=load();let score=0;
 d.questions.forEach((q,i)=>{document.querySelectorAll('input[name="q'+i+'"]').forEach(x=>x.parentElement.classList.remove("correct","wrong"));if(s.answers&&s.answers[i]!==undefined){let xs=document.querySelectorAll('input[name="q'+i+'"]').length?document.querySelectorAll('input[name="q'+i+'"]'):[];if(xs.length){xs[s.answers[i]].parentElement.classList.add(s.answers[i]===q.answer?"correct":"wrong");xs[q.answer].parentElement.classList.add("correct");if(s.answers[i]===q.answer)score++}}});
 if(score===5)localStorage.setItem("yc_done_"+current,"1");
 document.getElementById("result").className="result "+(score>=4?"good":"bad");document.getElementById("result").innerHTML="语法成绩：<b>"+score+" / 5</b>（"+score*20+"%）<br>"+(score>=4?"很好，继续保持。":"建议重新学习本日语法重点后再做一次。");updateProgress();
}
function updateProgress(){let n=0;for(let i=1;i<=30;i++)if(done(i))n++;document.getElementById("pt").textContent="完成 "+n+" / 30 天";document.getElementById("bar").style.width=n/30*100+"%";renderNav()}
function clearDay(){if(confirm("确定清空今天答案？")){localStorage.removeItem(storageKey());localStorage.removeItem("yc_done_"+current);render()}}
function copyAI(){
 save();const s=load(),d=DATA[current-1];
 const t="你是雨辰的六年级英语老师，请批改 Day "+current+"。\n\n语法："+(s.answers||[]).map((x,i)=>"第"+(i+1)+"题="+(x===undefined?"未答":String.fromCharCode(65+x))).join("，")+"\n\n句子纠错：\n"+(s.correction||"")+"\n\n阅读：\n"+(s.reading||[]).map((x,i)=>(i+1)+". "+x).join("\n")+"\n\n写作：\n"+(s.writing||"")+"\n\n口语：\n"+(s.speaking||"")+"\n\n请逐项批改，并用简单中文解释错误；给写作评分、列出3个主要弱点和下一步练习。";
 if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert("已复制，粘贴到 ChatGPT 即可。")).catch(()=>alert(t));else alert(t);
}
render();
</script></body></html>
